version: "3.8"

services:
  web:
    depends_on:
      - api
    build: ./frontend
    ports:
      - 80:3000
    restart: unless-stopped

  api:
    depends_on:
      - db
    build: ./backend
    ports:
      - 3001:3001
    environment:
      DB_URL: mongodb://db/vidly
    command: ./docker-entrypoint.sh
    restart: unless-stopped

  db:
    image: mongo:4.0-xenial
    ports:
      - 3002:3002
    volumes:
      - vidly:/data/db
    restart: unless-stopped

volumes:
  vidly:
